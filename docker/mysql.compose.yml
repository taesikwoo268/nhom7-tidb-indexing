services:
  mysql:
    extends:
      file: ./profiles/${PROFILE:-XS}.yml
      service: mysql
    build:
      context: .
      dockerfile: mysql.Dockerfile
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
      MYSQL_ROOT_HOST: "%"
      MYSQL_DATABASE: logistics
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
volumes:
  mysql_data:
