services:
  pd:
    extends:
      file: ./profiles/${PROFILE:-XS}.yml
      service: pd
    image: pingcap/pd:v8.5.5
    command:
      - --name=pd
      - --client-urls=http://0.0.0.0:2379
      - --peer-urls=http://0.0.0.0:2380
      - --advertise-client-urls=http://pd:2379
      - --advertise-peer-urls=http://pd:2380
      - --initial-cluster=pd=http://pd:2380
      - --data-dir=/data
    ports:
      - "127.0.0.1:2379:2379"
    volumes:
      - pd_data:/data

  tikv1:
    extends:
      file: ./profiles/${PROFILE:-XS}.yml
      service: tikv
    image: nhom7/tikv:v8.5.5-nodebug
    build:
      context: .
      dockerfile: tikv.Dockerfile
    depends_on: [pd]
    command:
      - --addr=0.0.0.0:20160
      - --advertise-addr=tikv1:20160
      - --status-addr=0.0.0.0:20180
      - --advertise-status-addr=tikv1:20180
      - --pd-endpoints=pd:2379
      - --data-dir=/data
      - --config=/tikv.toml
    volumes:
      - tikv1_data:/data
      - ./profiles/tikv-${PROFILE:-XS}.toml:/tikv.toml:ro

  tikv2:
    extends:
      file: ./profiles/${PROFILE:-XS}.yml
      service: tikv
    image: nhom7/tikv:v8.5.5-nodebug
    build:
      context: .
      dockerfile: tikv.Dockerfile
    depends_on: [pd]
    command:
      - --addr=0.0.0.0:20160
      - --advertise-addr=tikv2:20160
      - --status-addr=0.0.0.0:20180
      - --advertise-status-addr=tikv2:20180
      - --pd-endpoints=pd:2379
      - --data-dir=/data
      - --config=/tikv.toml
    volumes:
      - tikv2_data:/data
      - ./profiles/tikv-${PROFILE:-XS}.toml:/tikv.toml:ro

  tikv3:
    extends:
      file: ./profiles/${PROFILE:-XS}.yml
      service: tikv
    image: nhom7/tikv:v8.5.5-nodebug
    build:
      context: .
      dockerfile: tikv.Dockerfile
    depends_on: [pd]
    command:
      - --addr=0.0.0.0:20160
      - --advertise-addr=tikv3:20160
      - --status-addr=0.0.0.0:20180
      - --advertise-status-addr=tikv3:20180
      - --pd-endpoints=pd:2379
      - --data-dir=/data
      - --config=/tikv.toml
    volumes:
      - tikv3_data:/data
      - ./profiles/tikv-${PROFILE:-XS}.toml:/tikv.toml:ro

  tidb:
    extends:
      file: ./profiles/${PROFILE:-XS}.yml
      service: tidb
    image: pingcap/tidb:v8.5.5
    depends_on: [tikv1, tikv2, tikv3]
    command: ["--store=tikv", "--path=pd:2379"]
    ports:
      - "127.0.0.1:${TIDB_PORT:-4000}:4000"
      - "127.0.0.1:10080:10080"
volumes:
  pd_data:
  tikv1_data:
  tikv2_data:
  tikv3_data:
